  <!-- Data Scripts -->
  <script src="data/bible_surveys.js"></script>
  <script src="data/book_studies_ot.js"></script>
  <script src="data/book_studies_nt.js"></script>
  <script src="data/book_guide_renderer.js"></script>

  <script>
    (function() {
      'use strict';

      var root = document.getElementById('guideAppRoot');
      var picker = document.getElementById('bookPickerSelect');
      var themeBtn = document.getElementById('themeToggleBtn');
      var printBtn = document.getElementById('printBtn');
      var subtitle = document.getElementById('navbarSubtitle');

      // Theme sync
      var currentTheme = localStorage.getItem('biblia_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      updateThemeIcon(currentTheme);

      if (themeBtn) {
        themeBtn.addEventListener('click', function() {
          currentTheme = (currentTheme === 'dark') ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', currentTheme);
          localStorage.setItem('biblia_theme', currentTheme);
          updateThemeIcon(currentTheme);
        });
      }

      function updateThemeIcon(t) {
        if (!themeBtn) return;
        themeBtn.innerHTML = t === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      }

      if (printBtn) {
        printBtn.addEventListener('click', function() {
          window.print();
        });
      }

      function parseUrlParams() {
        var params = new URLSearchParams(window.location.search);
        var book = params.get('book');
        var survey = params.get('survey');
        if (book) {
          return { type: 'book', val: parseInt(book, 10) || 1 };
        }
        if (survey) {
          return { type: 'survey', val: survey };
        }
        return { type: 'book', val: 1 };
      }

      function renderCurrentPage() {
        var target = parseUrlParams();
        if (target.type === 'book') {
          var bookNo = target.val;
          if (bookNo < 1) bookNo = 1;
          if (bookNo > 66) bookNo = 66;
          
          if (picker) {
            picker.value = 'book:' + bookNo;
          }
          if (window.renderBookStudyGuideHtml) {
            root.innerHTML = window.renderBookStudyGuideHtml(bookNo, { isStandalone: true });
            var name = (window.BIBLIA_BOOK_STUDIES_OT && window.BIBLIA_BOOK_STUDIES_OT[bookNo]) ? window.BIBLIA_BOOK_STUDIES_OT[bookNo].meta.nameZh :
                       (window.BIBLIA_BOOK_STUDIES_NT && window.BIBLIA_BOOK_STUDIES_NT[bookNo]) ? window.BIBLIA_BOOK_STUDIES_NT[bookNo].meta.nameZh : ('第 ' + bookNo + ' 卷');
            document.title = name + ' 深入研究導讀 | Biblia';
            if (subtitle) subtitle.textContent = name + ' 深入研究';
          }
        } else if (target.type === 'survey') {
          var surveyKey = target.val;
          if (picker) {
            picker.value = 'survey:' + surveyKey;
          }
          if (window.renderSurveyGuideHtml) {
            root.innerHTML = window.renderSurveyGuideHtml(surveyKey, { isStandalone: true });
            var sTitle = (surveyKey === 'nt_survey' || surveyKey === 'ntSurvey') ? '新約聖經總覽' : '舊約聖經總覽';
            document.title = sTitle + ' | Biblia';
            if (subtitle) subtitle.textContent = sTitle;
          }
        }
        window.scrollTo(0, 0);
      }

      if (picker) {
        picker.addEventListener('change', function() {
          var parts = this.value.split(':');
          if (parts[0] === 'book') {
            window.location.search = '?book=' + parts[1];
          } else if (parts[0] === 'survey') {
            window.location.search = '?survey=' + parts[1];
          }
        });
      }

      // Initial render
      renderCurrentPage();

    })();
  </script>
