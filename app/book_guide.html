  <!-- Interactive Application Logic -->
  <script>
    (function() {
      'use strict';

      // 1. Setup BIBLIA global and Strong dictionary engine
      window.BIBLIA = window.BIBLIA || {};
      var strongDictData = { H: null, G: null };
      var strongDictState = { H: 'idle', G: 'idle' }; // idle | loading | ready | failed
      var strongDictWaiting = { H: [], G: [] };

      BIBLIA.strongDict = function(lang, data) {
        strongDictData[lang] = data;
        strongDictState[lang] = 'ready';
        var waiting = strongDictWaiting[lang];
        strongDictWaiting[lang] = [];
        waiting.forEach(function(fn) { fn(data); });
      };

      function ensureStrongDict(code, cb) {
        var lang = (code.charAt(0) === 'G' || code.charAt(0) === 'g') ? 'G' : 'H';
        if (strongDictState[lang] === 'ready') {
          cb(strongDictData[lang]);
          return;
        }
        strongDictWaiting[lang].push(cb);
        if (strongDictState[lang] === 'loading') return;

        strongDictState[lang] = 'loading';
        var s = document.createElement('script');
        s.src = 'data/strong_dict_' + lang + '.js';
        s.charset = 'utf-8';
        s.onerror = function() {
          strongDictState[lang] = 'failed';
          var waiting = strongDictWaiting[lang];
          strongDictWaiting[lang] = [];
          waiting.forEach(function(fn) { fn(null); });
        };
        document.head.appendChild(s);
      }

      function escapeHtml(s) {
        if (!s) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // 2. DOM Elements Cache
      var root = document.getElementById('guideAppRoot');
      var picker = document.getElementById('bookPickerSelect');
      var themeBtn = document.getElementById('themeToggleBtn');
      var printBtn = document.getElementById('printBtn');
      var subtitle = document.getElementById('navbarSubtitle');
      var categoryBar = document.getElementById('guideCategoryBar');
      var stickyJumpBar = document.getElementById('guideStickyJumpBar');
      var jumpbarInner = document.getElementById('jumpbarInner');
      var openReaderTopBtn = document.getElementById('openReaderTopBtn');

      var modal = document.getElementById('strongDictModal');
      var modalStrongCode = document.getElementById('modalStrongCode');
      var modalBody = document.getElementById('modalBody');
      var modalCloseBtn = document.getElementById('modalCloseBtn');

      var toast = document.getElementById('guideToast');
      var toastTimer = null;

      var openBookPaletteBtn = document.getElementById('openBookPaletteBtn');
      var bookPaletteModal = document.getElementById('bookPaletteModal');
      var paletteCloseBtn = document.getElementById('paletteCloseBtn');
      var paletteSearchInput = document.getElementById('paletteSearchInput');
      var paletteFilterPills = document.getElementById('paletteFilterPills');
      var paletteBooksGrid = document.getElementById('paletteBooksGrid');

      var readingPrefsToggleBtn = document.getElementById('readingPrefsToggleBtn');
      var readingPrefsPopover = document.getElementById('readingPrefsPopover');
      var prefFontSizeGroup = document.getElementById('prefFontSizeGroup');
      var prefFontFamilyGroup = document.getElementById('prefFontFamilyGroup');
      var prefContentWidthGroup = document.getElementById('prefContentWidthGroup');

      var inPageSearchInput = document.getElementById('inPageSearchInput');
      var searchMatchCount = document.getElementById('searchMatchCount');
      var searchPrevBtn = document.getElementById('searchPrevBtn');
      var searchNextBtn = document.getElementById('searchNextBtn');
      var searchClearBtn = document.getElementById('searchClearBtn');

      var fabTopBtn = document.getElementById('fabTopBtn');
      var fabJumpBtn = document.getElementById('fabJumpBtn');
      var fabPaletteBtn = document.getElementById('fabPaletteBtn');

      var currentTarget = { type: 'book', val: 1 };
      var searchMatches = [];
      var currentSearchIndex = -1;
      var jumpbarObserver = null;

      // 3. Theme Synchronization
      var currentTheme = localStorage.getItem('biblia_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      updateThemeIcon(currentTheme);

      if (themeBtn) {
        themeBtn.addEventListener('click', function() {
          currentTheme = (currentTheme === 'dark') ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', currentTheme);
          localStorage.setItem('biblia_theme', currentTheme);
          updateThemeIcon(currentTheme);
        });
      }

      function updateThemeIcon(t) {
        if (!themeBtn) return;
        themeBtn.innerHTML = t === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      }

      // 4. Reading Preferences Persistence
      var defaultPrefs = { fontSize: 'md', fontFamily: 'sans', contentWidth: 'wide' };
      var savedPrefs = defaultPrefs;
      try {
        var p = localStorage.getItem('biblia_guide_prefs');
        if (p) savedPrefs = Object.assign({}, defaultPrefs, JSON.parse(p));
      } catch (err) {}

      function applyReadingPrefs(prefs) {
        document.body.setAttribute('data-guide-font-size', prefs.fontSize || 'md');
        document.body.setAttribute('data-guide-font-family', prefs.fontFamily || 'sans');
        document.body.setAttribute('data-guide-content-width', prefs.contentWidth || 'wide');

        // Update active UI buttons in popover
        if (prefFontSizeGroup) {
          prefFontSizeGroup.querySelectorAll('.prefs-choice-btn').forEach(function(btn) {
            btn.classList.toggle('active', btn.getAttribute('data-val') === prefs.fontSize);
          });
        }
        if (prefFontFamilyGroup) {
          prefFontFamilyGroup.querySelectorAll('.prefs-choice-btn').forEach(function(btn) {
            btn.classList.toggle('active', btn.getAttribute('data-val') === prefs.fontFamily);
          });
        }
        if (prefContentWidthGroup) {
          prefContentWidthGroup.querySelectorAll('.prefs-choice-btn').forEach(function(btn) {
            btn.classList.toggle('active', btn.getAttribute('data-val') === prefs.contentWidth);
          });
        }

        try {
          localStorage.setItem('biblia_guide_prefs', JSON.stringify(prefs));
        } catch (err) {}
      }

      applyReadingPrefs(savedPrefs);

      if (readingPrefsToggleBtn && readingPrefsPopover) {
        readingPrefsToggleBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          var isHidden = readingPrefsPopover.style.display === 'none';
          readingPrefsPopover.style.display = isHidden ? 'flex' : 'none';
        });

        document.addEventListener('click', function(e) {
          if (readingPrefsPopover && !readingPrefsPopover.contains(e.target) && e.target !== readingPrefsToggleBtn) {
            readingPrefsPopover.style.display = 'none';
          }
        });

        if (prefFontSizeGroup) {
          prefFontSizeGroup.addEventListener('click', function(e) {
            var btn = e.target.closest('.prefs-choice-btn');
            if (!btn) return;
            savedPrefs.fontSize = btn.getAttribute('data-val');
            applyReadingPrefs(savedPrefs);
          });
        }
        if (prefFontFamilyGroup) {
          prefFontFamilyGroup.addEventListener('click', function(e) {
            var btn = e.target.closest('.prefs-choice-btn');
            if (!btn) return;
            savedPrefs.fontFamily = btn.getAttribute('data-val');
            applyReadingPrefs(savedPrefs);
          });
        }
        if (prefContentWidthGroup) {
          prefContentWidthGroup.addEventListener('click', function(e) {
            var btn = e.target.closest('.prefs-choice-btn');
            if (!btn) return;
            savedPrefs.contentWidth = btn.getAttribute('data-val');
            applyReadingPrefs(savedPrefs);
          });

      if (printBtn) {
        printBtn.addEventListener('click', function() {

      // 5. Toast Notification System
      function showToast(msg, icon) {
        if (!toast) return;
        icon = icon || 'fa-check';
        toast.innerHTML = '<i class="fas ' + icon + '" aria-hidden="true"></i> <span>' + escapeHtml(msg) + '</span>';
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function() {
          toast.classList.remove('show');
        }, 2800);
      }

      // 6. URL Parsing & Category Bar Sync
      function parseUrlParams() {
        var params = new URLSearchParams(window.location.search);
        var book = params.get('book');
        var survey = params.get('survey');
        if (book) {
          return { type: 'book', val: parseInt(book, 10) || 1 };
        }
        if (survey) {
          return { type: 'survey', val: survey };
        }
        return { type: 'book', val: 1 };
      }

      function updateActiveCategoryPill(target) {
        if (!categoryBar) return;
        var pills = categoryBar.querySelectorAll('.cat-pill');
        var activeCat = 'all';

        if (target.type === 'survey') {
          activeCat = 'survey';
        } else if (target.type === 'book') {
          var b = target.val;
          if (b >= 1 && b <= 5) activeCat = 'torah';
          else if (b >= 6 && b <= 17) activeCat = 'history_ot';
          else if (b >= 18 && b <= 22) activeCat = 'poetry';
          else if (b >= 23 && b <= 27) activeCat = 'prophet_major';
          else if (b >= 28 && b <= 39) activeCat = 'prophet_minor';
          else if (b >= 40 && b <= 44) activeCat = 'gospel_acts';
          else if (b >= 45 && b <= 57) activeCat = 'pauline';
          else if (b >= 58 && b <= 66) activeCat = 'general_rev';
        }

        pills.forEach(function(pill) {
          var cat = pill.getAttribute('data-cat');
          if (cat === activeCat) {
            pill.classList.add('active');
            try {
              pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            } catch (err) {}
          } else {
            pill.classList.remove('active');
          }
        });
      }

      // 7. Sticky Section Jump Bar (ScrollSpy) Generator
      function buildStickyJumpbar() {
        if (!stickyJumpBar || !jumpbarInner) return;
        if (jumpbarObserver) {
          jumpbarObserver.disconnect();
          jumpbarObserver = null;
        }

        var sections = root.querySelectorAll('section.guide-section[id]');
        if (!sections.length) {
          stickyJumpBar.style.display = 'none';
          return;
        }

        var html = '';
        sections.forEach(function(sec, idx) {
          var sId = sec.id;
          var title = sec.getAttribute('data-section-title') || ('段落 ' + (idx + 1));
          var icon = sec.getAttribute('data-section-icon') || 'fa-bookmark';
          html += '<a href="#' + sId + '" class="jumpbar-pill' + (idx === 0 ? ' active' : '') + '" data-target="' + sId + '">' +
            '<i class="fas ' + icon + ' jumpbar-icon" aria-hidden="true"></i>' +
            '<span>' + escapeHtml(title) + '</span>' +
          '</a>';
        });

        jumpbarInner.innerHTML = html;
        stickyJumpBar.style.display = 'block';

        // Setup ScrollSpy Observer
        var pills = jumpbarInner.querySelectorAll('.jumpbar-pill');
        var pillMap = {};
        pills.forEach(function(p) {
          pillMap[p.getAttribute('data-target')] = p;
        });

        jumpbarObserver = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              var id = entry.target.id;
              pills.forEach(function(p) { p.classList.remove('active'); });
              if (pillMap[id]) {
                pillMap[id].classList.add('active');
                try {
                  pillMap[id].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } catch (e) {}
              }
            }
          });
        }, {
          rootMargin: '-80px 0px -70% 0px',
          threshold: 0
        });

        sections.forEach(function(sec) {
          jumpbarObserver.observe(sec);
        });

        // Pill click smooth scroll with header offset
        jumpbarInner.querySelectorAll('.jumpbar-pill').forEach(function(p) {
          p.addEventListener('click', function(e) {
            e.preventDefault();
            var targetId = this.getAttribute('data-target');
            var targetEl = document.getElementById(targetId);
            if (targetEl) {
              targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        });
      }

      // 8. SPA In-Place Page Renderer (No Full Reload)
      function renderCurrentPage(target, pushState) {
        currentTarget = target || parseUrlParams();
        clearInPageSearch();

        if (currentTarget.type === 'book') {
          var bookNo = currentTarget.val;
          if (bookNo < 1) bookNo = 1;
          if (bookNo > 66) bookNo = 66;
          currentTarget.val = bookNo;

          if (picker) picker.value = 'book:' + bookNo;
          if (openReaderTopBtn) openReaderTopBtn.href = 'index.html#read/' + bookNo + '/1';

          if (window.renderBookStudyGuideHtml) {
            root.innerHTML = window.renderBookStudyGuideHtml(bookNo, { isStandalone: true });
            var name = (window.BIBLIA_BOOK_STUDIES_OT && window.BIBLIA_BOOK_STUDIES_OT[bookNo]) ? window.BIBLIA_BOOK_STUDIES_OT[bookNo].meta.nameZh :
                       (window.BIBLIA_BOOK_STUDIES_NT && window.BIBLIA_BOOK_STUDIES_NT[bookNo]) ? window.BIBLIA_BOOK_STUDIES_NT[bookNo].meta.nameZh : ('第 ' + bookNo + ' 卷');
            document.title = name + ' 深入研究導讀 | Biblia';
            if (subtitle) subtitle.textContent = name + ' 深入研究導讀';
          }
        } else if (currentTarget.type === 'survey') {
          var surveyKey = currentTarget.val;
          if (picker) picker.value = 'survey:' + surveyKey;

          if (window.renderSurveyGuideHtml) {
            root.innerHTML = window.renderSurveyGuideHtml(surveyKey, { isStandalone: true });
            var sTitle = (surveyKey === 'nt_survey' || surveyKey === 'ntSurvey') ? '新約聖經總覽' : '舊約聖經總覽';
            document.title = sTitle + ' | Biblia';
            if (subtitle) subtitle.textContent = sTitle;
          }
        }

        updateActiveCategoryPill(currentTarget);
        buildStickyJumpbar();
        updatePaletteActiveState();

        if (pushState !== false) {
          var newQuery = currentTarget.type === 'book' ? ('?book=' + currentTarget.val) : ('?survey=' + currentTarget.val);
          if (window.location.search !== newQuery) {
            history.pushState(null, '', newQuery);
          }
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // Popstate handling for browser back/forward buttons
      window.addEventListener('popstate', function() {
        renderCurrentPage(parseUrlParams(), false);
      });

      // 9. Quick Dropdown Picker Event
      if (picker) {
        picker.addEventListener('change', function() {
          var parts = this.value.split(':');
          if (parts[0] === 'book') {
            renderCurrentPage({ type: 'book', val: parseInt(parts[1], 10) || 1 });
          } else if (parts[0] === 'survey') {
            renderCurrentPage({ type: 'survey', val: parts[1] });
          }
        });
      }

      // 10. Category Pill Navigation
      if (categoryBar) {
        categoryBar.addEventListener('click', function(e) {
          var pill = e.target.closest('.cat-pill');
          if (!pill) return;
          var cat = pill.getAttribute('data-cat');
          var catTargets = {
            'all': { type: 'book', val: 1 },
            'survey': { type: 'survey', val: 'ot_survey' },
            'torah': { type: 'book', val: 1 },
            'history_ot': { type: 'book', val: 6 },
            'poetry': { type: 'book', val: 18 },
            'prophet_major': { type: 'book', val: 23 },
            'prophet_minor': { type: 'book', val: 28 },
            'gospel_acts': { type: 'book', val: 40 },
            'pauline': { type: 'book', val: 45 },
            'general_rev': { type: 'book', val: 58 }

      function renderPaletteGrid(filterQuery, filterCategory) {

              '<div class="palette-card-en">Old Testament Survey</div>' +
              '<div class="palette-card-orig">創世記至瑪拉基書 · 39 卷全貌</div>' +
              '<div class="palette-card-meta"><span>救贖聖約展開</span><span>39 卷全景</span></div>' +
            '</div>';
          }
          if (sMatchNT) {
            html += '<div class="palette-book-card" data-type="survey" data-val="nt_survey">' +
              '<div class="palette-card-top"><span class="palette-card-num">SURVEY #2</span><span class="palette-card-cat">新約總覽</span></div>' +
              '<div class="palette-card-title">新約聖經總覽</div>' +
              '<div class="palette-card-en">New Testament Survey</div>' +
              '<div class="palette-card-orig">馬太福音至啟示錄 · 27 卷全貌</div>' +
              '<div class="palette-card-meta"><span>基督國度成全</span><span>27 卷全景</span></div>' +

            var searchStr = (b.nameZh + ' ' + b.nameEn + ' ' + (b.originalTitle || '') + ' ' + (b.category || '') + ' ' + b.no).toLowerCase();
            if (searchStr.indexOf(q) === -1) return;

          var numPad = b.no < 10 ? ('0' + b.no) : ('' + b.no);

          html += '<div class="palette-book-card' + (isActive ? ' active' : '') + '" data-type="book" data-val="' + b.no + '">' +

        if (!html) {

      // 12. In-Page Realtime Fulltext Search Controller
      function clearInPageSearch() {
        if (!root) return;
        root.querySelectorAll('.guide-search-highlight').forEach(function(m) {
          var parent = m.parentNode;
          parent.replaceChild(document.createTextNode(m.textContent), m);
          parent.normalize();
        });
        searchMatches = [];
        currentSearchIndex = -1;
        if (searchMatchCount) searchMatchCount.style.display = 'none';
        if (searchPrevBtn) searchPrevBtn.style.display = 'none';
        if (searchNextBtn) searchNextBtn.style.display = 'none';
        if (searchClearBtn) searchClearBtn.style.display = 'none';
      }

      function executeInPageSearch(term) {
        clearInPageSearch();
        term = (term || '').trim();
        if (!term || term.length < 1) return;

        var regex = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode: function(node) {
            if (!node.textContent.trim()) return NodeFilter.FILTER_REJECT;
            var parent = node.parentElement;
            if (!parent) return NodeFilter.FILTER_REJECT;
            var tag = parent.tagName.toLowerCase();
            if (tag === 'script' || tag === 'style' || tag === 'mark' || tag === 'select' || tag === 'button') {
              return NodeFilter.FILTER_REJECT;
            }
            return NodeFilter.FILTER_ACCEPT;
          }
        });

        var nodesToReplace = [];
        while (walker.nextNode()) {
          var textNode = walker.currentNode;
          if (regex.test(textNode.nodeValue)) {
            nodesToReplace.push(textNode);
          }
        }

        nodesToReplace.forEach(function(textNode) {
          var frag = document.createDocumentFragment();
          var parts = textNode.nodeValue.split(regex);
          parts.forEach(function(part) {
            if (part && part.toLowerCase() === term.toLowerCase()) {
              var mark = document.createElement('mark');
              mark.className = 'guide-search-highlight';
              mark.textContent = part;
              frag.appendChild(mark);
              searchMatches.push(mark);
            } else if (part) {
              frag.appendChild(document.createTextNode(part));
            }
          });
          if (textNode.parentNode) {
            textNode.parentNode.replaceChild(frag, textNode);
          }
        });

        if (searchMatches.length > 0) {
          currentSearchIndex = 0;
          highlightCurrentMatch();
          if (searchMatchCount) {
            searchMatchCount.textContent = '1 / ' + searchMatches.length;
            searchMatchCount.style.display = 'inline-block';
          }
          if (searchPrevBtn) searchPrevBtn.style.display = 'inline-block';
          if (searchNextBtn) searchNextBtn.style.display = 'inline-block';
          if (searchClearBtn) searchClearBtn.style.display = 'inline-block';
        } else {
          if (searchMatchCount) {
            searchMatchCount.textContent = '0 處相符';
            searchMatchCount.style.display = 'inline-block';
          }
          if (searchClearBtn) searchClearBtn.style.display = 'inline-block';
        }
      }

      function highlightCurrentMatch() {
        searchMatches.forEach(function(m, idx) {
          m.classList.toggle('current', idx === currentSearchIndex);
        });
        if (searchMatches[currentSearchIndex]) {
          searchMatches[currentSearchIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
          if (searchMatchCount) {
            searchMatchCount.textContent = (currentSearchIndex + 1) + ' / ' + searchMatches.length;
          }
        }
      }

      if (inPageSearchInput) {
        var searchDebounce = null;
        inPageSearchInput.addEventListener('input', function() {
          var val = this.value;
          clearTimeout(searchDebounce);
          searchDebounce = setTimeout(function() {
            executeInPageSearch(val);
          }, 220);
        });

        inPageSearchInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (e.shiftKey) {
              navigateSearch(-1);
            } else {
              navigateSearch(1);
            }
          } else if (e.key === 'Escape') {
            inPageSearchInput.value = '';
            clearInPageSearch();
            inPageSearchInput.blur();
          }
        });
      }

      function navigateSearch(delta) {
        if (!searchMatches.length) return;
        currentSearchIndex += delta;
        if (currentSearchIndex < 0) currentSearchIndex = searchMatches.length - 1;
        if (currentSearchIndex >= searchMatches.length) currentSearchIndex = 0;
        highlightCurrentMatch();
      }

      if (searchPrevBtn) searchPrevBtn.addEventListener('click', function() { navigateSearch(-1); });
      if (searchNextBtn) searchNextBtn.addEventListener('click', function() { navigateSearch(1); });
      if (searchClearBtn) {
        searchClearBtn.addEventListener('click', function() {
          if (inPageSearchInput) inPageSearchInput.value = '';
          clearInPageSearch();
        });
      }

      // 13. Copy Verse & Share Section Anchor Handlers
      document.addEventListener('click', function(e) {
        // Copy verse button
        var copyBtn = e.target.closest('.btn-copy-verse');
        if (copyBtn) {
          e.preventDefault();

              showToast('已複製經文：' + bookName + ' ' + ref, 'fa-copy');
            }).catch(function() {
              showToast('複製完成', 'fa-check');
            });
          } else {
            showToast('已複製經文', 'fa-copy');
          }
          return;
        }

        // Section anchor button
        var secAnchor = e.target.closest('.guide-sec-anchor-btn');
        if (secAnchor) {
          e.preventDefault();
          var anchorId = secAnchor.getAttribute('data-anchor');

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(shareUrl).then(function() {
              showToast('已複製專題段落分享連結！', 'fa-link');
            });

      });

      // 14. Strong Dictionary Modal Handlers
      function openStrongModal(code) {
        if (!modal || !modalStrongCode || !modalBody) return;
        code = (code || '').trim().toUpperCase();
        if (!code) return;

        modalStrongCode.textContent = code;
        modalBody.innerHTML = '<div class="modal-loading" style="text-align: center; padding: 30px; color: var(--fg-muted);"><i class="fas fa-spinner fa-spin"></i> 正在載入字典釋義...</div>';
        modal.style.display = 'flex';
        modal.setAttribute('aria-hidden', 'false');

        ensureStrongDict(code, function(dict) {
          if (!dict) {
            modalBody.innerHTML = '<div class="modal-error" style="text-align: center; padding: 24px; color: #e55353;"><i class="fas fa-exclamation-triangle"></i> 無法載入 Strong 原文字典資料檔案。</div>';
            return;
          }
          var entry = dict[code];
          if (!entry) {
            modalBody.innerHTML = '<div class="modal-empty" style="text-align: center; padding: 24px; color: var(--fg-muted);"><i class="fas fa-info-circle"></i> 字典中無編號 <strong>' + escapeHtml(code) + '</strong> 之釋義資料。</div>';
            return;
          }

          var html = '<div class="strong-entry-detail">';
          if (entry.o) {
            html += '<div class="dict-orig-box"><span class="dict-orig-word">' + escapeHtml(entry.o) + '</span></div>';
          }
          if (entry.z) {
            html += '<div class="dict-zh-section">' + escapeHtml(entry.z) + '</div>';
          }
          if (entry.e) {
            html += '<div class="dict-en-section">' + escapeHtml(entry.e) + '</div>';
          }
          html += '</div>';
          modalBody.innerHTML = html;
        });
      }

      function closeStrongModal() {
        if (!modal) return;
        modal.style.display = 'none';
        modal.setAttribute('aria-hidden', 'true');
      }

      if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeStrongModal);
      if (modal) {
        modal.addEventListener('click', function(e) {
          if (e.target === modal) closeStrongModal();
        });
      }

      // Delegation for Strong tags
      document.addEventListener('click', function(e) {
        var strongTag = e.target.closest('.clickable-strong-tag');
        if (strongTag) {
          e.preventDefault();
          var sCode = strongTag.getAttribute('data-strong') || strongTag.textContent;
          openStrongModal(sCode);
        }
      });

      // 15. Floating Action Buttons (FAB) & Scroll Listener
      window.addEventListener('scroll', function() {
        var scrollY = window.pageYOffset || document.documentElement.scrollTop;
        if (fabTopBtn) {
          fabTopBtn.style.display = scrollY > 320 ? 'flex' : 'none';
        }
      }, { passive: true });

      if (fabTopBtn) {
        fabTopBtn.addEventListener('click', function() {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      if (fabJumpBtn) {
        fabJumpBtn.addEventListener('click', function() {
          if (stickyJumpBar) {
            stickyJumpBar.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        });
      }

      // 16. Global Keyboard Shortcuts
      document.addEventListener('keydown', function(e) {
        var activeTag = (document.activeElement && document.activeElement.tagName) ? document.activeElement.tagName.toLowerCase() : '';
        var isInputFocused = (activeTag === 'input' || activeTag === 'textarea' || activeTag === 'select');

        if (e.key === 'Escape') {
          if (modal && modal.style.display === 'flex') {
            closeStrongModal();
          } else if (bookPaletteModal && bookPaletteModal.style.display === 'flex') {
            closeBookPalette();
          } else if (readingPrefsPopover && readingPrefsPopover.style.display === 'flex') {
            readingPrefsPopover.style.display = 'none';
          } else if (inPageSearchInput && inPageSearchInput.value) {
            inPageSearchInput.value = '';
            clearInPageSearch();
            inPageSearchInput.blur();
          }
          return;
        }

        if (isInputFocused) return;

        // B or G: Open Book Explorer Palette
        if (e.key === 'b' || e.key === 'B' || e.key === 'g' || e.key === 'G') {
          e.preventDefault();
          openBookPalette();
        }
        // /: Focus In-Page Search
        else if (e.key === '/') {
          e.preventDefault();
          if (inPageSearchInput) {
            inPageSearchInput.focus();
            inPageSearchInput.select();
          }
        }
        // [ or P: Previous book
        else if (e.key === '[' || e.key === 'p' || e.key === 'P') {
          if (currentTarget.type === 'book' && currentTarget.val > 1) {
            e.preventDefault();
            renderCurrentPage({ type: 'book', val: currentTarget.val - 1 });
          }
        }
        // ] or N: Next book
        else if (e.key === ']' || e.key === 'n' || e.key === 'N') {
          if (currentTarget.type === 'book' && currentTarget.val < 66) {
            e.preventDefault();
            renderCurrentPage({ type: 'book', val: currentTarget.val + 1 });
          }
        }
      });

      // 17. Initial Render
      renderCurrentPage(parseUrlParams(), false);

    })();
  </script>
</body>
</html>
