<style>
/* ===================== 聖經挑戰專屬高質感樣式 (Bible Challenge Design System) ===================== */
:root {
  --game-safe-top: env(safe-area-inset-top, 0px);
  --game-safe-bottom: env(safe-area-inset-bottom, 0px);
  --game-safe-left: env(safe-area-inset-left, 0px);
  --game-safe-right: env(safe-area-inset-right, 0px);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body.game-body {
  margin: 0;
  padding: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  display: flex;
  flex-direction: column;
}

/* 頂部全寬導覽列 */
.game-topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bar);
  border-bottom: 1px solid var(--line-soft);
  padding: calc(8px + var(--game-safe-top)) calc(16px + var(--game-safe-right)) 8px calc(16px + var(--game-safe-left));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: var(--sh-1);
}

.game-top-left, .game-top-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.game-brand-group {
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: inherit;
}

.game-brand-icon {
  font-size: 1.4rem;
  line-height: 1;
}

.game-brand-title {
  font-family: var(--font-cinzel);
  font-weight: 700;
  font-size: 1.15rem;
  letter-spacing: 0.05em;
  color: var(--accent);
}

.game-brand-sub {
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--fg-mute);
  padding: 2px 8px;
  background: var(--bg-soft);
  border-radius: var(--r-pill);
  border: 1px solid var(--line-soft);
}

@media (max-width: 640px) {
  .game-brand-sub { display: none; }
}

.game-nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  font-size: 0.82rem;
  font-weight: 600;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--fg);
  text-decoration: none;
  cursor: pointer;
  transition: all var(--t-fast);
}

.game-nav-btn:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}

.game-stat-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  font-size: 0.8rem;
  font-weight: 700;
  border-radius: var(--r-pill);
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid var(--ring);
}

/* 等級徽章與經驗值進度條 (Gamification Level & XP Bar) */
.game-level-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.game-level-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  font-size: 0.78rem;
  font-weight: 800;
  border-radius: var(--r-pill);
  background: var(--bg-soft);
  color: var(--accent);
  border: 1px solid var(--line);
  white-space: nowrap;
}

.game-xp-wrap {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 90px;
}

@media (max-width: 768px) {
  .game-xp-wrap { display: none; }
}

.game-xp-track {
  width: 100%;
  height: 6px;
  background: var(--bg-soft);
  border-radius: var(--r-pill);
  overflow: hidden;
  border: 1px solid var(--line-soft);
}

.game-xp-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--hit-line), var(--accent));
  border-radius: var(--r-pill);
  transition: width 0.35s ease;
}

.game-xp-text {
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--fg-mute);
  text-align: right;
  line-height: 1;
}

/* 語音朗讀專屬按鈕與波動波紋 (TTS Speech Waveform) */
.tts-speak-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  font-size: 0.82rem;
  font-weight: 700;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--accent);
  cursor: pointer;
  transition: all var(--t-fast);
}

.tts-speak-btn:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
}

.tts-speak-btn.speaking {
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 0 10px var(--ring);
  animation: pulseSpeaking 1.2s infinite ease-in-out;
}

@keyframes pulseSpeaking {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

/* 錯題複習專區與紅點徽章 (Mistakes Review) */
.tab-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 1px 6px;
  font-size: 0.72rem;
  font-weight: 800;
  border-radius: var(--r-pill);
  background: var(--seal);
  color: #fff;
  margin-left: 4px;
}

.mistake-clarify-box {
  background: rgba(192, 56, 43, 0.08);
  border: 1.5px solid var(--seal);
  border-radius: var(--r-md);
  padding: 12px 16px;
  margin: 8px 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.mistake-clarify-title {
  font-size: 0.88rem;
  font-weight: 800;
  color: var(--seal);
  display: flex;
  align-items: center;
  gap: 6px;
}

.mistake-clarify-content {
  font-size: 0.88rem;
  line-height: 1.6;
  color: var(--fg);
}

.memory-hook-box {
  background: rgba(212, 155, 56, 0.12);
  border-left: 3px solid var(--hit-line);
  border-radius: 4px;
  padding: 8px 12px;
  margin-top: 6px;
  font-size: 0.85rem;
  line-height: 1.5;
  color: var(--fg);
}

.memory-hook-title {
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 2px;
}

/* 遊戲大廳主框架 */
.game-main-shell {
  flex: 1;
  max-width: 960px;
  width: 100%;
  margin: 0 auto;
  padding: 16px 16px calc(32px + var(--game-safe-bottom));
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* 遊戲類別分頁切換列 */
.game-tabs-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 8px;
  scrollbar-width: none;
}

.game-tabs-bar::-webkit-scrollbar {
  display: none;
}

.game-nav-tab {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  font-size: 0.92rem;
  font-weight: 700;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--bg-alt);
  color: var(--fg-dim);
  cursor: pointer;
  transition: all var(--t-fast);
  box-shadow: var(--sh-1);
}

.game-nav-tab:hover {
  border-color: var(--accent);
  color: var(--fg);
}

.game-nav-tab.active {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
  box-shadow: 0 4px 12px var(--ring);
}

/* 問答挑戰卡片 (Quiz Card) */
.quiz-card {
  background: var(--bg-alt);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: 24px;
  box-shadow: var(--sh-2);
  display: flex;
  flex-direction: column;
  gap: 18px;
  transition: all var(--t-mid);
}

@media (max-width: 600px) {
  .quiz-card {
    padding: 16px;
    border-radius: var(--r-lg);
  }
}

.quiz-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  border-bottom: 1px solid var(--line-soft);
  padding-bottom: 12px;
}

.quiz-meta-info {
  display: flex;
  align-items: center;
  gap: 8px;
}

.quiz-pill-badge {
  font-size: 0.8rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: var(--r-pill);
  background: var(--accent-soft);
  color: var(--accent);
}

.quiz-cat-badge {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--fg-mute);
}

/* 核心需求：選擇題 vs 填空題 切換開關 */
.quiz-mode-switch {
  display: inline-flex;
  padding: 3px;
  background: var(--bg-soft);
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
}

.mode-switch-btn {
  padding: 5px 12px;
  font-size: 0.78rem;
  font-weight: 700;
  border-radius: var(--r-pill);
  border: none;
  background: transparent;
  color: var(--fg-dim);
  cursor: pointer;
  transition: all var(--t-fast);
}

.mode-switch-btn.active {
  background: var(--bar);
  color: var(--accent);
  box-shadow: var(--sh-1);
}

/* 提示線索區 (Clues Box) */
.quiz-prompt-box {
  background: var(--bg-soft);
  border-radius: var(--r-lg);
  padding: 18px 20px;
  border: 1px solid var(--line-soft);
}

.clue-list-heading {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--fg);
  margin-bottom: 12px;
}

.clues-ordered-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.clue-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 0.96rem;
  line-height: 1.6;
  color: var(--fg);
}

.clue-num {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 0.76rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 3px;
}

/* 經文填空專屬題幹 */
.verse-prompt-box {
  text-align: center;
  padding: 24px 20px;
}

.verse-ref-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 12px;
}

.verse-cloze-text {
  font-family: var(--font-serif);
  font-size: 1.35rem;
  line-height: 1.8;
  color: var(--fg);
  margin-bottom: 12px;
}

.verse-cloze-text strong,
.quiz-blank-word {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 4px;
}

.quiz-clue-hint {
  font-size: 0.85rem;
  color: var(--fg-mute);
}

/* 作答區域 1：選擇題按鈕網格 (4選1) */
.quiz-options-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

@media (max-width: 520px) {
  .quiz-options-grid {
    grid-template-columns: 1fr;
  }
}

.quiz-opt-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--fg);
  font-size: 1.02rem;
  font-weight: 700;
  cursor: pointer;
  text-align: left;
  transition: all var(--t-fast);
}

.quiz-opt-btn:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
  transform: translateY(-1px);
}

.quiz-opt-btn:active {
  transform: scale(0.98);
}

.opt-label {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--bg-soft);
  color: var(--fg-dim);
  font-size: 0.84rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.quiz-opt-btn.correct {
  background: rgba(46, 107, 73, 0.16) !important;
  border-color: var(--ok) !important;
  color: var(--ok) !important;
}

.quiz-opt-btn.correct .opt-label {
  background: var(--ok);
  color: #fff;
}

.quiz-opt-btn.wrong {
  background: rgba(192, 56, 43, 0.14) !important;
  border-color: var(--seal) !important;
  color: var(--seal) !important;
}

.quiz-opt-btn.wrong .opt-label {
  background: var(--seal);
  color: #fff;
}

/* 作答區域 2：填空題輸入框與字磚 (Fill-in) */
.fill-in-container {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.fill-input-row {
  display: flex;
  gap: 8px;
}

.fill-text-input {
  flex: 1;
  padding: 12px 16px;
  font-size: 1.05rem;
  font-weight: 600;
  border-radius: var(--r-md);
  border: 1.5px solid var(--line);
  background: var(--bg);
  color: var(--fg);
  outline: none;
  transition: border-color var(--t-fast);
}

.fill-text-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--ring);
}

.fill-submit-btn {
  padding: 0 20px;
  font-size: 0.95rem;
  font-weight: 700;
  white-space: nowrap;
}

.fill-tools-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.fill-tool-chip {
  padding: 4px 10px;
  font-size: 0.78rem;
  font-weight: 600;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--bg-soft);
  color: var(--fg-dim);
  cursor: pointer;
  transition: all var(--t-fast);
}

.fill-tool-chip:hover {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}

.fill-char-bank-title {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--fg-mute);
}

.fill-char-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.char-tile-btn {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--bg-alt);
  color: var(--fg);
  font-size: 1.15rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--sh-1);
  transition: all var(--t-fast);
}

.char-tile-btn:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
  transform: translateY(-2px);
}

.char-tile-btn:active {
  transform: scale(0.92);
}

/* 詳細回饋與屬靈小百科卡片 (Feedback Card) */
.quiz-result-feedback {
  margin-top: 6px;
  animation: fadeInDown 0.3s var(--ease);
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.feedback-card {
  border-radius: var(--r-lg);
  padding: 18px 20px;
  border: 1.5px solid transparent;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.feedback-card.fb-correct {
  background: rgba(46, 107, 73, 0.08);
  border-color: var(--ok);
}

.feedback-card.fb-wrong {
  background: rgba(192, 56, 43, 0.08);
  border-color: var(--seal);
}

.fb-header {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--fg);
}

.fb-target-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 1.05rem;
}

.fb-target-name {
  font-size: 1.25rem;
  color: var(--accent);
}

.fb-name-meaning {
  font-size: 0.88rem;
  color: var(--fg-mute);
}

.fb-info-row {
  font-size: 0.9rem;
  color: var(--fg-dim);
  line-height: 1.5;
}

.fb-desc-text {
  font-size: 0.92rem;
  line-height: 1.65;
  color: var(--fg);
  margin: 4px 0 0;
}

.fb-verse-box {
  background: var(--bg-alt);
  border-left: 3px solid var(--accent);
  padding: 10px 14px;
  border-radius: var(--r-sm);
  margin-top: 4px;
}

.fb-verse-ref {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
}

.fb-verse-text {
  font-family: var(--font-serif);
  font-size: 0.96rem;
  line-height: 1.6;
  color: var(--fg);
}

.fb-actions-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 6px;
}

.fb-read-link {
  text-decoration: none;
}

.fb-next-btn {
  padding: 8px 24px;
  font-size: 0.95rem;
  font-weight: 700;
}

/* ===================== 十字填字遊戲樣式 (Crossword Grid Layout) ===================== */
.cw-app-shell {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.cw-header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.cw-title {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--fg);
}

.cw-desc {
  font-size: 0.84rem;
  color: var(--fg-mute);
}

.cw-level-select {
  padding: 6px 14px;
  font-size: 0.88rem;
  font-weight: 700;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--bg-alt);
  color: var(--fg);
  outline: none;
}

.cw-tools-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.cw-tool-btn {
  padding: 6px 12px;
  font-size: 0.82rem;
  font-weight: 600;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--bg-alt);
  color: var(--fg);
  cursor: pointer;
  transition: all var(--t-fast);
}

.cw-tool-btn:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}

.cw-layout-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

@media (max-width: 768px) {
  .cw-layout-body {
    grid-template-columns: 1fr;
  }
}

.cw-grid-wrap {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.cw-board-grid {
  display: grid;
  gap: 3px;
  background: var(--line);
  padding: 6px;
  border-radius: var(--r-lg);
  max-width: 440px;
  width: 100%;
  aspect-ratio: 1 / 1;
  box-shadow: var(--sh-2);
}

.cw-cell {
  position: relative;
  background: var(--bg-alt);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  aspect-ratio: 1 / 1;
}

.cw-block-cell {
  background: var(--bg-soft);
  opacity: 0.65;
}

.cw-active-cell {
  cursor: pointer;
  transition: background-color var(--t-fast);
}

.cw-active-cell:hover {
  background: var(--accent-soft);
}

.cw-active-cell.cw-word-highlight {
  background: rgba(212, 155, 56, 0.18);
}

.cw-active-cell.cw-selected {
  background: var(--accent) !important;
  color: var(--accent-ink) !important;
  box-shadow: 0 0 0 2px var(--accent-hi);
  z-index: 2;
}

.cw-active-cell.cw-correct-cell {
  background: rgba(46, 107, 73, 0.22);
}

.cw-active-cell.cw-wrong-cell {
  background: rgba(192, 56, 43, 0.22);
}

.cell-num {
  position: absolute;
  top: 2px;
  left: 3px;
  font-size: 0.62rem;
  font-weight: 800;
  color: var(--fg-mute);
  line-height: 1;
}

.cw-selected .cell-num {
  color: var(--accent-ink);
}

.cell-letter {
  font-size: 1.35rem;
  font-weight: 800;
  font-family: var(--font-serif);
}

@media (max-width: 480px) {
  .cell-letter { font-size: 1.1rem; }
}

.cw-clues-wrap {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-height: 520px;
  overflow-y: auto;
  padding-right: 4px;
}

.cw-clue-heading {
  margin: 0 0 8px;
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--accent);
}

.cw-clue-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.cw-clue-item {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 8px 12px;
  border-radius: var(--r-md);
  background: var(--bg-alt);
  border: 1px solid var(--line-soft);
  font-size: 0.88rem;
  line-height: 1.45;
  cursor: pointer;
  transition: all var(--t-fast);
}

.cw-clue-item:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
}

.cw-clue-item.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  box-shadow: 0 2px 6px var(--ring);
}

.cw-clue-badge {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 0.72rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===================== 時間線排序樣式 (Timeline Sorter) ===================== */
.timeline-app-shell {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.tl-header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}

.tl-title {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 800;
}

.tl-desc {
  font-size: 0.84rem;
  color: var(--fg-mute);
}

.tl-events-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tl-event-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  border-radius: var(--r-lg);
  border: 1.5px solid var(--line);
  background: var(--bg-alt);
  box-shadow: var(--sh-1);
  transition: all var(--t-fast);
}

.tl-event-card:hover {
  border-color: var(--accent);
  box-shadow: var(--sh-2);
}

.tl-card-order-badge {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 800;
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.tl-card-content {
  flex: 1;
}

.tl-event-text {
  font-size: 0.98rem;
  font-weight: 700;
  color: var(--fg);
  line-height: 1.4;
}

.tl-event-history-info {
  margin-top: 4px;
  display: flex;
  gap: 12px;
  font-size: 0.8rem;
  color: var(--ok);
  font-weight: 700;
}

.tl-card-actions {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.tl-move-btn {
  width: 28px;
  height: 28px;
  border-radius: var(--r-xs);
  border: 1px solid var(--line);
  background: var(--bg-soft);
  color: var(--fg-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 0.75rem;
  transition: all var(--t-fast);
}

.tl-move-btn:hover {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.tl-actions-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
}

.tl-verify-btn {
  padding: 10px 24px;
  font-size: 0.95rem;
  font-weight: 700;
}

.tl-feedback-msg {
  font-size: 0.92rem;
  font-weight: 700;
  padding: 8px 14px;
  border-radius: var(--r-md);
}

.tl-feedback-msg.ok {
  background: rgba(46, 107, 73, 0.12);
  color: var(--ok);
  border: 1px solid var(--ok);
}

.tl-feedback-msg.err {
  background: rgba(192, 56, 43, 0.12);
  color: var(--seal);
  border: 1px solid var(--seal);
}

/* ===================== 成就彈窗樣式 (Achievements Modal) ===================== */
.ach-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.ach-modal-overlay[hidden] {
  display: none;
}

.ach-modal-dialog {
  background: var(--bg-alt);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  max-width: 580px;
  width: 100%;
  max-height: 85dvh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--sh-4);
  overflow: hidden;
}

.ach-modal-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.ach-modal-title {
  margin: 0;
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--accent);
}

.ach-modal-close {
  background: transparent;
  border: none;
  font-size: 1.4rem;
  color: var(--fg-mute);
  cursor: pointer;
}

.ach-modal-body {
  padding: 20px;
  overflow-y: auto;
}

.ach-modal-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.ach-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--bg);
  transition: all var(--t-fast);
}

.ach-card.unlocked {
  border-color: var(--hit-line);
  background: rgba(212, 155, 56, 0.08);
}

.ach-card.locked {
  opacity: 0.6;
  filter: grayscale(1);
}

.ach-icon {
  font-size: 1.8rem;
}

.ach-title {
  font-weight: 800;
  font-size: 0.95rem;
  color: var(--fg);
}

.ach-desc {
  font-size: 0.8rem;
  color: var(--fg-mute);
  margin-top: 2px;
}

.ach-ok-badge {
  font-size: 0.72rem;
  color: var(--ok);
  font-weight: 800;
}

/* 成就動態提示泡泡 (Toast) */
.game-achievement-toast {
  pointer-events: auto;
  background: var(--bar);
  border: 1.5px solid var(--hit-line);
  border-radius: var(--r-lg);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--sh-4);
  transform: translateY(120%);
  opacity: 0;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

.game-achievement-toast.visible {
  transform: translateY(0);
  opacity: 1;
}

.ach-toast-icon {
  font-size: 1.8rem;
}

.ach-toast-badge {
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.ach-toast-title {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--fg);
}

.ach-toast-desc {
  font-size: 0.78rem;
  color: var(--fg-mute);
}

/* 全螢幕 Canvas 慶祝彩帶粒子 */
#confettiCanvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 99;
}

/* ===================== v3：今日目標、科學學習法、難度與闖關 ===================== */
.today-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px 16px;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--bg-alt);
  box-shadow: var(--sh-1);
}

.today-panel.goal-hit {
  border-color: var(--ok);
  background: linear-gradient(90deg, rgba(46, 107, 73, 0.10), var(--bg-alt) 60%);
}

.today-goal {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.today-ring {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  transform: rotate(-90deg);
}

.today-ring circle {
  fill: none;
  stroke-width: 5;
}

.today-ring-track { stroke: var(--bg-soft); }

.today-ring-fill {
  stroke: var(--accent);
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s ease;
}

.goal-hit .today-ring-fill { stroke: var(--ok); }

.today-goal-text {
  display: flex;
  flex-direction: column;
  line-height: 1.3;
  min-width: 0;
}

.today-goal-text strong {
  font-size: 0.98rem;
  font-weight: 800;
  color: var(--fg);
}

.today-goal-text span {
  font-size: 0.76rem;
  color: var(--fg-mute);
}

.today-chips {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}

.today-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  font-size: 0.8rem;
  font-weight: 700;
  border-radius: var(--r-pill);
  border: 1px solid var(--line-soft);
  background: var(--bg);
  color: var(--fg-dim);
  white-space: nowrap;
}

.today-chip.has-due {
  border-color: var(--seal);
  color: var(--seal);
}

.today-goal-pick select {
  border: none;
  background: transparent;
  color: var(--accent);
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}

.today-tips-btn {
  cursor: pointer;
  color: var(--accent);
  border-color: var(--ring);
  background: var(--accent-soft);
}

.tips-panel {
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--bg-alt);
  padding: 14px 16px;
  animation: fadeInDown 0.25s var(--ease);
}

.tips-intro {
  font-size: 0.86rem;
  color: var(--fg-dim);
  margin-bottom: 10px;
  line-height: 1.6;
}

.tips-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
}

.tip-card {
  padding: 10px 12px;
  border-radius: var(--r-md);
  background: var(--bg);
  border: 1px solid var(--line-soft);
}

.tip-head {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 6px;
  font-size: 0.92rem;
}

.tip-en {
  font-size: 0.7rem;
  color: var(--fg-mute);
  font-weight: 600;
}

.tip-card p {
  margin: 6px 0 0;
  font-size: 0.84rem;
  line-height: 1.6;
  color: var(--fg-dim);
}

.diff-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}

.diff-bar-label {
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--fg-mute);
  margin-right: 2px;
}

.diff-chip {
  padding: 5px 11px;
  font-size: 0.8rem;
  font-weight: 700;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  background: var(--bg-alt);
  color: var(--fg-dim);
  cursor: pointer;
  transition: all var(--t-fast);
}

.diff-chip small {
  opacity: 0.7;
  font-weight: 600;
}

.diff-chip:hover { border-color: var(--accent); color: var(--fg); }

.diff-chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

.diff-badge, .quiz-type-badge {
  font-size: 0.74rem;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line-soft);
  background: var(--bg);
  white-space: nowrap;
}

.diff-badge.diff-1 { color: var(--ok); }
.diff-badge.diff-2 { color: var(--hit-line); }
.diff-badge.diff-3 { color: var(--seal); }

.quiz-meta-info { flex-wrap: wrap; }

.round-dots {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.round-dot {
  width: 22px;
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--bg-soft);
  border: 1px solid var(--line-soft);
}

.round-dot.ok { background: var(--ok); border-color: var(--ok); }
.round-dot.bad { background: var(--seal); border-color: var(--seal); }
.round-dot.cur { border-color: var(--accent); background: var(--accent-soft); }

.clue-list-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.clue-count {
  font-size: 0.76rem;
  font-weight: 800;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 2px 8px;
  border-radius: var(--r-pill);
}

.clue-item.clue-locked {
  color: var(--fg-mute);
  font-size: 0.86rem;
  opacity: 0.75;
}

.clue-item.clue-locked .clue-num {
  background: transparent;
  font-size: 0.8rem;
}

.clue-item.clue-new {
  animation: fadeInDown 0.35s var(--ease);
}

.clue-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.clue-reveal-btn, .clue-reveal-all, .lifeline-btn {
  padding: 7px 12px;
  font-size: 0.84rem;
  font-weight: 700;
  border-radius: var(--r-md);
  border: 1px dashed var(--accent);
  background: var(--bg);
  color: var(--accent);
  cursor: pointer;
  transition: all var(--t-fast);
}

.clue-reveal-all {
  border-style: solid;
  border-color: var(--line);
  color: var(--fg-dim);
}

.clue-reveal-btn:hover, .clue-reveal-all:hover, .lifeline-btn:hover:not(:disabled) {
  background: var(--accent-soft);
}

.lifeline-btn:disabled, .fill-tool-chip:disabled, .char-tile-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.lifeline-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.kbd-hint {
  margin-left: auto;
  font-size: 0.72rem;
  color: var(--fg-mute);
}

@media (hover: none) {
  .kbd-hint { display: none; }
}

.quiz-opt-btn.removed {
  opacity: 0.3;
  text-decoration: line-through;
  pointer-events: none;
}

.quiz-opt-btn:disabled { cursor: default; }
.quiz-opt-btn:disabled:hover { transform: none; }

.fill-slots {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.fill-slot, .cw-slot {
  width: 38px;
  height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--r-sm);
  border: 1.5px dashed var(--line);
  background: var(--bg);
  font-family: var(--font-serif);
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--fg);
}

.fill-slot.filled, .cw-slot.typed {
  border-style: solid;
  border-color: var(--accent);
}

.cw-slot.known {
  border-style: solid;
  border-color: var(--ok);
  background: rgba(46, 107, 73, 0.10);
}

.fill-text-input.is-correct { border-color: var(--ok); }
.fill-text-input.is-wrong { border-color: var(--seal); }

.fill-tool-chip small, .lifeline-btn small, .cw-tool-btn small { opacity: 0.7; }

.xp-breakdown {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.xp-chip {
  font-size: 0.76rem;
  font-weight: 800;
  padding: 2px 9px;
  border-radius: var(--r-pill);
  background: rgba(46, 107, 73, 0.12);
  color: var(--ok);
}

.xp-chip.neg { background: rgba(192, 56, 43, 0.10); color: var(--seal); }
.xp-chip.combo { background: rgba(212, 155, 56, 0.18); color: var(--accent); }

.contrast-card {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--bg-alt);
  padding: 8px 12px;
  font-size: 0.86rem;
  line-height: 1.55;
}

.contrast-title {
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 2px;
}

.review-line {
  font-size: 0.84rem;
  font-weight: 700;
  line-height: 1.5;
  padding: 8px 12px;
  border-radius: var(--r-md);
  border: 1px solid var(--line-soft);
  background: var(--bg-alt);
  color: var(--fg-dim);
}

.review-line.review-up, .review-line.review-done {
  border-color: var(--ok);
  color: var(--ok);
  background: rgba(46, 107, 73, 0.08);
}

.review-line.review-added { border-color: var(--hit-line); }

@keyframes shakeX {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

.shake { animation: shakeX 0.4s ease; }

.empty-card {
  text-align: center;
  align-items: center;
}

.empty-icon {
  font-size: 2.6rem;
  line-height: 1;
}

/* 一輪結算 */
.round-summary {
  text-align: center;
  align-items: center;
}

.rs-stars {
  display: flex;
  gap: 6px;
  font-size: 2.4rem;
  line-height: 1;
}

.rs-star {
  color: var(--bg-soft);
  -webkit-text-stroke: 1px var(--line);
}

.rs-star.on {
  color: var(--hit-line);
  -webkit-text-stroke: 0;
  animation: fadeInDown 0.4s var(--ease);
}

.rs-title {
  margin: 0;
  font-size: 1.3rem;
  font-weight: 900;
  color: var(--fg);
}

.rs-praise {
  margin: 0;
  font-size: 0.92rem;
  color: var(--fg-dim);
}

.rs-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  width: 100%;
  max-width: 520px;
}

@media (max-width: 480px) {
  .rs-stats { grid-template-columns: repeat(2, 1fr); }
}

.rs-stat {
  display: flex;
  flex-direction: column;
  padding: 10px 6px;
  border-radius: var(--r-md);
  background: var(--bg);
  border: 1px solid var(--line-soft);
}

.rs-stat b {
  font-size: 1.2rem;
  color: var(--accent);
}

.rs-stat span {
  font-size: 0.74rem;
  color: var(--fg-mute);
}

.rs-wrong, .rs-tip {
  width: 100%;
  max-width: 560px;
  text-align: left;
}

.rs-wrong-title {
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--seal);
  margin-bottom: 6px;
}

.rs-wrong-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.rs-wrong-chip {
  font-size: 0.8rem;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: var(--r-pill);
  border: 1px solid var(--seal);
  color: var(--seal);
  background: rgba(192, 56, 43, 0.06);
}

.rs-tip {
  display: flex;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  background: rgba(212, 155, 56, 0.10);
  border-left: 3px solid var(--hit-line);
}

.rs-tip .tip-icon { font-size: 1.4rem; }

.rs-tip p {
  margin: 2px 0 0;
  font-size: 0.84rem;
  line-height: 1.55;
  color: var(--fg-dim);
}

.rs-actions, .srs-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

/* 錯題本：間隔重複 */
.srs-dashboard {
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: var(--bg-alt);

.srs-list {

.srs-item-name {

.srs-item-box {

.srs-item-box i {

  height: 6px;

.srs-item-box i.on { background: var(--ok); border-color: var(--ok); }

.srs-item-due, .srs-item-wrong {

  color: var(--fg-mute);
  font-weight: 700;
}

.srs-item.is-due .srs-item-due { color: var(--seal); }

.srs-empty {
  text-align: center;
  padding: 16px 8px;
}

.srs-empty h4 {
  margin: 8px 0 4px;
  font-size: 1.1rem;
  color: var(--ok);
}

.srs-empty p {

  max-width: 420px;
  font-size: 0.88rem;

}

/* 十字填字：作答列 */
.cw-progress {
  display: flex;
  align-items: center;
  gap: 10px;
}

.cw-progress-track, .coverage-track, .ach-progress {
  flex: 1;
  height: 8px;
  border-radius: var(--r-pill);
  background: var(--bg-soft);
  border: 1px solid var(--line-soft);
  overflow: hidden;
}

.cw-progress-fill, .coverage-fill, .ach-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--hit-line), var(--accent));
  transition: width 0.4s ease;
}

.cw-progress-text {
  font-size: 0.82rem;
  font-weight: 800;
  color: var(--fg-dim);
  white-space: nowrap;
}

.cw-side {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

.cw-answer-bar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  border-radius: var(--r-lg);
  border: 1.5px solid var(--accent);
  background: var(--bg-alt);
  box-shadow: var(--sh-1);
}

.cw-ab-head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.cw-ab-dir {
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--fg-mute);
  flex: 1;
}

.cw-ab-clue {
  font-size: 0.98rem;
  font-weight: 700;
  line-height: 1.55;
  color: var(--fg);
}

.cw-slots {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.cw-ab-solved {
  font-size: 0.9rem;
  color: var(--ok);
  line-height: 1.55;
}

.cw-ab-solved p {
  margin: 4px 0 0;
  color: var(--fg-dim);
}

.cw-ab-msg {
  min-height: 1.2em;
  font-size: 0.86rem;
  font-weight: 700;
  line-height: 1.5;
}

.cw-ab-msg.ok { color: var(--ok); }
.cw-ab-msg.err { color: var(--seal); }
.cw-ab-msg.warn { color: var(--hit-line); }

.cw-ab-empty {
  font-weight: 800;
  color: var(--ok);
}

.cw-cell {
  border: none;
  padding: 0;
  font: inherit;
  color: var(--fg);
}

/* 空格透明、可填格加框，盤面形狀一目了然 */
.cw-board-grid {
  background: transparent;
  box-shadow: none;
  padding: 0;
  gap: 4px;
}

.cw-block-cell {
  background: transparent;
  opacity: 1;
}

.cw-active-cell {
  background: var(--bg-alt);
  box-shadow: inset 0 0 0 1.5px var(--line);
}

.cw-level-select { max-width: 100%; }

.cw-active-cell.cw-word-highlight {
  background: rgba(212, 155, 56, 0.28);
  box-shadow: inset 0 0 0 2px var(--accent);
}

.cw-active-cell.cw-correct-cell { color: var(--ok); }
.cw-active-cell.cw-revealed-cell { color: var(--hit-line); }

.cw-clue-item.solved .cw-clue-text { color: var(--fg-mute); }

.cw-clue-answer {
  display: inline-block;
  margin-left: 6px;
  font-weight: 800;
  color: var(--ok);
}

.cw-complete {
  margin-top: 6px;
  padding: 16px;
  border-radius: var(--r-lg);
  border: 1.5px solid var(--ok);
  background: rgba(46, 107, 73, 0.07);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cw-complete-title {
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--ok);
}

.cw-recap {
  margin: 0;
  padding-left: 18px;
  font-size: 0.86rem;
  line-height: 1.65;
  color: var(--fg-dim);
}

.tts-speak-btn.tts-compact {
  padding: 4px 10px;
  font-size: 0.78rem;
}

/* 年代排序：點選互換與逐張標示 */
.tl-howto {
  font-size: 0.86rem;
  color: var(--fg-dim);
  line-height: 1.6;
}

.tl-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

ol.tl-events-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.tl-event-card {
  padding: 0;
  gap: 0;
  align-items: stretch;
}

.tl-card-main {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border: none;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  min-width: 0;
}

/* 作答後鎖定的元素保持清晰（覆寫 style.css 的 button:disabled 半透明） */
.tl-card-main:disabled,
.quiz-opt-btn:disabled,
.fill-submit-btn:disabled {
  opacity: 1;
  cursor: default;
}

.quiz-opt-btn:disabled:not(.correct):not(.wrong) { opacity: 0.6; }
.quiz-opt-btn.removed:disabled { opacity: 0.3; }

.tl-card-content {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.tl-card-actions {
  justify-content: center;
  padding: 8px 10px 8px 0;
}

.tl-move-btn:disabled { opacity: 0.35; cursor: default; }

.tl-event-card.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--ring);
  transform: translateY(-1px);
}

.tl-event-card.correct {
  border-color: var(--ok);
  background: rgba(46, 107, 73, 0.07);
}

.tl-event-card.misplaced {
  border-color: var(--seal);
  background: rgba(192, 56, 43, 0.05);
}

.tl-mark-hint {
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--seal);
}

.tl-ok-tick {
  margin-left: auto;
  font-weight: 900;
  color: var(--ok);
}

.tl-event-note {
  font-size: 0.84rem;
  line-height: 1.55;
  color: var(--fg-dim);
}

.tl-actions-bar { flex-wrap: wrap; }
.tl-feedback-msg { flex-basis: 100%; }

.tl-feedback-msg.info {
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid var(--ring);
}

/* 學習儀表板 */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}

@media (max-width: 560px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
}

.stat-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 10px 6px;
  border-radius: var(--r-md);
  border: 1px solid var(--line-soft);
  background: var(--bg);
}

.stat-icon { font-size: 1.2rem; }

.stat-card b {
  font-size: 0.98rem;
  color: var(--fg);
}

.stat-card span:last-child {
  font-size: 0.72rem;
  color: var(--fg-mute);
}

.modal-section-title {
  margin: 4px 0 10px;
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--accent);
}

.coverage-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}

.coverage-row {
  display: grid;
  grid-template-columns: 7.5em 1fr auto;
  align-items: center;
  gap: 10px;
  font-size: 0.86rem;
}

.coverage-row b {
  font-size: 0.8rem;
  color: var(--fg-dim);
}

.ach-progress {
  margin-top: 6px;
  height: 6px;
}

.ach-progress-text {
  font-size: 0.7rem;
  color: var(--fg-mute);
  margin-top: 2px;
}

.ach-body { flex: 1; min-width: 0; }

/* Toast 堆疊 */
.toast-stack {
  position: fixed;
  right: calc(16px + var(--game-safe-right));
  bottom: calc(16px + var(--game-safe-bottom));
  z-index: 120;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  pointer-events: none;
  max-width: calc(100vw - 32px);
}

.game-toast {
  pointer-events: auto;
  padding: 10px 14px;
  border-radius: var(--r-md);
  background: var(--bar);
  color: var(--fg);
  border: 1px solid var(--line);
  box-shadow: var(--sh-4);
  font-size: 0.88rem;
  font-weight: 700;
  line-height: 1.5;
  max-width: 420px;
  transform: translateY(20px);
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.game-toast.visible {
  transform: translateY(0);
  opacity: 1;
}

.game-toast.toast-ok { border-color: var(--ok); }
.game-toast.toast-warn { border-color: var(--seal); }

.game-nav-btn.is-on {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}

.game-nav-btn, .game-stat-pill, .game-level-badge { white-space: nowrap; }

@media (max-width: 1180px) {
  .game-brand-sub { display: none; }
  .game-top-right .btn-text { display: none; }
}

@media (max-width: 720px) {
  .game-topbar { flex-wrap: wrap; }
  .game-top-right { flex-wrap: wrap; justify-content: flex-end; }
}

/* 手機：頂列收成兩行以內（首頁可點左上品牌回去） */
@media (max-width: 520px) {
  .game-topbar { gap: 6px; padding-top: calc(6px + var(--game-safe-top)); padding-bottom: 6px; }
  .game-top-right { gap: 4px; width: 100%; justify-content: space-between; }
  .game-nav-btn { padding: 5px 8px; }

  #topComboBadge { display: none !important; }
  .game-top-right a.game-nav-btn { display: none; }
  .game-brand-title { font-size: 1rem; }
  .today-panel { padding: 10px 12px; }
  .today-chips { gap: 4px; }
  .today-chip { padding: 4px 8px; font-size: 0.74rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
