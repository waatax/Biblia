<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a241e"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8bf7a"/>
      <stop offset="50%" stop-color="#c99742"/>
      <stop offset="100%" stop-color="#9e6e22"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#f4eedf"/>
      <stop offset="100%" stop-color="#e8dfcb"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4"/>

  <!-- Book Container with shadow -->
  <g filter="url(#drop)">
    <!-- Book Spine & Base -->
    <path d="M96 376 C176 348 240 364 256 378 C272 364 336 348 416 376 L416 148 C336 120 272 136 256 150 C240 136 176 120 96 148 Z" fill="#443525" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Left Page -->
    <path d="M104 366 C178 340 238 356 252 368 L252 142 C238 130 178 114 104 140 Z" fill="url(#pageGrad)"/>
    
    <!-- Right Page -->
    <path d="M408 366 C334 340 274 356 260 368 L260 142 C274 130 334 114 408 140 Z" fill="url(#pageGrad)"/>
    
    <!-- Center Spine Line -->
    <line x1="256" y1="138" x2="256" y2="376" stroke="#c99742" stroke-width="4"/>

    <!-- Scripture Lines - Left Page -->
    <line x1="130" y1="172" x2="226" y2="162" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <line x1="130" y1="202" x2="226" y2="192" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <line x1="130" y1="232" x2="226" y2="222" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <line x1="130" y1="262" x2="226" y2="252" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <line x1="130" y1="292" x2="200" y2="283" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round" opacity="0.65"/>

    <!-- Scripture Lines - Right Page -->
    <line x1="286" y1="162" x2="382" y2="172" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <line x1="286" y1="192" x2="382" y2="202" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <line x1="286" y1="222" x2="382" y2="232" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <line x1="286" y1="252" x2="382" y2="262" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
    <line x1="286" y1="282" x2="356" y2="291" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round" opacity="0.65"/>

    <!-- Alpha and Omega / Cross Emblem at center top -->
    <circle cx="256" cy="116" r="28" fill="url(#goldGrad)" stroke="#1a140e" stroke-width="3"/>
    <!-- Cross in emblem -->
    <path d="M256 98 L256 134 M244 110 L268 110" stroke="#1c1813" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Biblia Wordmark at bottom -->
  <text x="256" y="448" font-family="'Plus Jakarta Sans', 'Noto Serif TC', serif" font-size="34" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">BIBLIA</text>
</svg>
